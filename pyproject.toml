[project]
name = "command-inst"
version = "0.1.0"
description = "Robot Voice Command NLU Pipeline for Hospital Service Robot"
readme = "README.md"
authors = [
    { name = "Rehandra145", email = "rehandra09052004@gmail.com" }
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=2.2.6",
    "piper-phonemize>=1.1.0; sys_platform != 'win32'",
    "piper-phonemize-fix>=1.2.0; sys_platform == 'win32'",
    "scikit-learn>=1.5.0",
    "sherpa-onnx==2.0.1+cuda; platform_machine == 'aarch64' and sys_platform == 'linux'",
    "sherpa-onnx>=2.0.1; platform_machine != 'aarch64' or sys_platform != 'linux'",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[tool.uv]
package = false
find-links = [
    "https://k2-fsa.github.io/sherpa/onnx/cuda.html",
]
